<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <style>

        body{
            margin:0;
            padding:40px;
            background:#f4f7fb;
            font-family:Arial,Helvetica,sans-serif;
        }

        .container{
            max-width:600px;
            margin:auto;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .header{
            background:#2563eb;
            color:white;
            text-align:center;
            padding:30px;
        }

        .content{
            padding:40px;
            color:#333;
            line-height:1.8;
        }

        .button{
            display:inline-block;
            background:#2563eb;
            color:white!important;
            text-decoration:none;
            padding:14px 28px;
            border-radius:8px;
            font-weight:bold;
        }

        .footer{
            text-align:center;
            color:#777;
            padding:25px;
            font-size:13px;
        }

        .warning{
            background:#eef5ff;
            border-left:5px solid #2563eb;
            padding:15px;
            margin:30px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Password Reset Request</h1>

    </div>

    <div class="content">

        <h2>Hello <span th:text="${username}"></span>,</h2>

        <p>

            We received a request to reset your Resonance account password.

        </p>

        <p style="text-align:center;margin:40px 0;">

            <a th:href="${resetLink}" class="button">

                Reset Password

            </a>

        </p>

        <div class="warning">

            This password reset link will expire in <strong>1 hour</strong>.

        </div>

        <p>

            If you didn't request a password reset, you can safely ignore this email.
            Your password will remain unchanged.

        </p>

    </div>

    <div class="footer">

        Resonance Security Team

    </div>

</div>

</body>

</html>
